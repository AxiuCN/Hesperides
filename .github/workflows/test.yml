name: 回归套件

# 引擎的全部套件都是离线的（注入 fetchImpl + fixtures），干净 runner 上也是满配，
# 所以这里直接跑，不需要 npm install、不需要数据、不需要联网。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hesperides-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 用 `-latest`：跟着 GitHub 的镜像走，和监控工作流保持一致；
        # 本仓库零第三方依赖，只用到 node 与 bash/gh，镜像轮换（如 24.04 → 26.04）不影响。
        # Node：22 / 24 / 26 是闸门（22 维护期、24 维护期=当前生产、26 Active LTS）；
        # 20 已于 2026-04-30 EOL，只做兼容性观测（experimental → 红了不阻断）。
        # Windows / macOS 各一条（Node 24）：Bot 跑在 Windows，路径分隔符与大小写不敏感类问题
        # 只有那边能暴露；macOS 顺带覆盖 macmini 部署场景。
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: ubuntu-latest
            node: '26'
          - os: ubuntu-latest
            node: '20'
            experimental: true
          - os: windows-latest
            node: '24'
          - os: macos-latest
            node: '24'
    # 仅 experimental 的条目允许失败
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Node 版本
        run: node -v

      - name: 列出套件
        run: node test/run.mjs --list

      - name: 跑全部套件
        run: node test/run.mjs